<g class="node gamma" id="node-integral" data-node="integral" tabindex="0" role="button" aria-label="Construct hyperbolic γ" aria-pressed="false"><title>Construct hyperbolic γ</title><desc>Start with an explicit, absolutely convergent regularized integral on the fundamental strip. Prove holomorphy and extend the function by finite products of its shift factors.</desc><rect class="card" x="54" y="164" width="360" height="82" rx="3" fill="#123941" stroke="#48b4c9" stroke-width="1.5"/><text x="70" y="182" font-size="10" fill="#abe0e9" font-weight="600" text-anchor="start" letter-spacing=".7">CONSTRUCTION · REGULARIZED INTEGRAL</text><text x="70" y="206" font-size="16" fill="#abe0e9" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">GammaContinuation.gamma</text><text x="70" y="227" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >BSS integral · finite-product continuation</text></g>
<g class="node gamma" id="node-core" data-node="core" tabindex="0" role="button" aria-label="Gamma foundation" aria-pressed="false"><title>Gamma foundation</title><desc>Prove the local identities, exact pole and zero sets, simple residues for irrational period ratios, positivity, and the uniform ratio estimates needed for contour decay. These results supply HypGammaCore.</desc><rect class="card" x="520" y="164" width="360" height="82" rx="3" fill="#123941" stroke="#48b4c9" stroke-width="1.5"/><text x="536" y="182" font-size="10" fill="#abe0e9" font-weight="600" text-anchor="start" letter-spacing=".7">CORE · SHIFTS, POLES &amp; GROWTH</text><text x="536" y="206" font-size="16" fill="#abe0e9" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">GammaContinuation.core</text><text x="536" y="227" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Reflection · residues · uniform ratio bounds</text></g>
<g class="node gamma" id="node-two_gamma" data-node="two_gamma" tabindex="0" role="button" aria-label="Two-gamma transform" aria-pressed="false"><title>Two-gamma transform</title><desc>Local incommensurable periods determine the symmetric Fourier transform. The elementary sech integral fixes its normalization, and a finite shift argument extends the evaluation to the full residue-corrected domain.</desc><rect class="card" x="986" y="164" width="360" height="82" rx="3" fill="#123941" stroke="#48b4c9" stroke-width="1.5"/><text x="1002" y="182" font-size="10" fill="#abe0e9" font-weight="600" text-anchor="start" letter-spacing=".7">TWO-GAMMA · FOURIER EVALUATION</text><text x="1002" y="206" font-size="16" fill="#abe0e9" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">two_gamma_explicit</text><text x="1002" y="227" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Dual shifts · sech normalization · crossed poles</text></g>
<g class="node gamma" id="node-four_gamma" data-node="four_gamma" tabindex="0" role="button" aria-label="Four-gamma contours" aria-pressed="false"><title>Four-gamma contours</title><desc>Define K₄ by an actual vertical integral with finite residue corrections. Prove line independence, evenness, the swap identity, and the four-term relation. Generalized residues retain coincident poles. The contour machinery from this stage also supports Euler; the four-term relation itself is not used to prove Euler.</desc><rect class="card" x="520" y="282" width="360" height="82" rx="3" fill="#123941" stroke="#48b4c9" stroke-width="1.5"/><text x="536" y="300" font-size="10" fill="#abe0e9" font-weight="600" text-anchor="start" letter-spacing=".7">FOUR-GAMMA · CORRECTED CONTOURS</text><text x="536" y="324" font-size="16" fill="#abe0e9" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">K4_line_explicit · K4_four_term</text><text x="536" y="345" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Residues · line independence · evenness · swap</text></g>
<g class="node gamma" id="node-euler" data-node="euler" tabindex="0" role="button" aria-label="Euler transformation" aria-pressed="false"><title>Euler transformation</title><desc>Prove Euler on an initial open domain by absolutely integrable Fourier insertion and Fubini. Fixed contour loops around moving pole clusters establish holomorphy, and a connected complex scaling domain extends the identity throughout the required convergent, non-pinched parameter range.</desc><rect class="card" x="986" y="282" width="360" height="82" rx="3" fill="#123941" stroke="#48b4c9" stroke-width="1.5"/><text x="1002" y="300" font-size="10" fill="#abe0e9" font-weight="600" text-anchor="start" letter-spacing=".7">EULER · PARAMETER CONTINUATION</text><text x="1002" y="324" font-size="16" fill="#abe0e9" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">K4_euler</text><text x="1002" y="345" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Fourier insertion · Fubini · moving pole clusters</text></g>
<g class="node bridge" id="node-interface" data-node="interface" tabindex="0" role="button" aria-label="Full gamma interface" aria-pressed="false"><title>Full gamma interface</title><desc>Assemble every HypGamma field from the explicit gamma construction and its integral identities. Specialize to ω₁ = d + 1 and ω₂ = 1 + 1/d. This interface supplies the analytic input throughout the coefficient proof, including direct uses in the column, product, and restricted Fourier transforms.</desc><rect class="card" x="520" y="396" width="360" height="70" rx="3" fill="#144550" stroke="#69d0e3" stroke-width="2"/><text x="536" y="414" font-size="10" fill="#c6f0f5" font-weight="600" text-anchor="start" letter-spacing=".7">FULL INTERFACE · SPECIALIZED PERIODS</text><text x="536" y="438" font-size="16" fill="#c6f0f5" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">ruijsenaarsHypGamma</text><text x="536" y="459" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Analytic input for the coefficient construction</text></g>
<g class="node analysis" id="node-samples" data-node="samples" tabindex="0" role="button" aria-label="Sample the coefficients" aria-pressed="false"><title>Sample the coefficients</title><desc>The specialized gamma gives the samples W and the concrete coefficient data, including W₀ = −1 and Wₐ W₋ₐ = δ for nonzero a. The full gamma interface supplies analytic identities throughout the Fourier stage.</desc><rect class="card" x="520" y="540" width="360" height="76" rx="3" fill="#392b12" stroke="#e6b353" stroke-width="1.5"/><text x="536" y="558" font-size="10" fill="#efd291" font-weight="600" text-anchor="start" letter-spacing=".7">SAMPLING · CONCRETE COEFFICIENTS</text><text x="536" y="582" font-size="16" fill="#efd291" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">Concrete.toCoeffData</text><text x="536" y="603" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >F(z) = 1/γ(ω₂ + z) · explicit odd-order matrix</text></g>
<g class="node analysis" id="node-quadratics" data-node="quadratics" tabindex="0" role="button" aria-label="Quadratic identities" aria-pressed="false"><title>Quadratic identities</title><desc>The column interpolation formula and the two-gamma transform determine the discrete Fourier transform of the samples. The reciprocal Fourier relation then proves all quadratic identities.</desc><rect class="card" x="54" y="650" width="360" height="76" rx="3" fill="#392b12" stroke="#e6b353" stroke-width="1.5"/><text x="70" y="668" font-size="10" fill="#efd291" font-weight="600" text-anchor="start" letter-spacing=".7">COLUMN FOURIER · QUADRATICS</text><text x="70" y="692" font-size="16" fill="#efd291" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">column_fourier · Q_eq_zero</text><text x="70" y="713" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >All quadratic residuals vanish</text></g>
<g class="node analysis" id="node-products" data-node="products" tabindex="0" role="button" aria-label="Product transforms" aria-pressed="false"><title>Product transforms</title><desc>Contour sampling gives the two product transforms and the negative-column transform, including crossed poles, double poles, and exceptional sample corrections.</desc><rect class="card" x="986" y="540" width="360" height="76" rx="3" fill="#392b12" stroke="#e6b353" stroke-width="1.5"/><text x="1002" y="558" font-size="10" fill="#efd291" font-weight="600" text-anchor="start" letter-spacing=".7">PRODUCTS · CONTOUR SAMPLING</text><text x="1002" y="582" font-size="16" fill="#efd291" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">left_product · right_product</text><text x="1002" y="603" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Product transforms + negative-column transform</text></g>
<g class="node analysis" id="node-restricted" data-node="restricted" tabindex="0" role="button" aria-label="Restricted Fourier vanishing" aria-pressed="false"><title>Restricted Fourier vanishing</title><desc>Combine the product transforms with the proved Euler and four-term identities. Their coefficients cancel to give the restricted Fourier vanishing statement used in the algebraic completion.</desc><rect class="card" x="986" y="650" width="360" height="76" rx="3" fill="#392b12" stroke="#e6b353" stroke-width="1.5"/><text x="1002" y="668" font-size="10" fill="#efd291" font-weight="600" text-anchor="start" letter-spacing=".7">RESTRICTED · FOURIER VANISHING</text><text x="1002" y="692" font-size="16" fill="#efd291" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">restricted_fourier</text><text x="1002" y="713" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Euler + four-term identity cancel the bracket</text></g>
<g class="node algebra" id="node-cubics" data-node="cubics" tabindex="0" role="button" aria-label="All cubic identities" aria-pressed="false"><title>All cubic identities</title><desc>Quadratics and restricted Fourier vanishing feed the ordered induction. Boundary and collision identities handle degenerate cases; normal forms and reflection by matrix inversion extend the result to every cubic identity.</desc><rect class="card" x="520" y="806" width="360" height="76" rx="3" fill="#20372b" stroke="#78bd94" stroke-width="1.5"/><text x="536" y="824" font-size="10" fill="#bee3cc" font-weight="600" text-anchor="start" letter-spacing=".7">COMPLETION · ALL CUBICS</text><text x="536" y="848" font-size="16" fill="#bee3cc" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">CoeffData.C_all</text><text x="536" y="869" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Boundary cases · interpolation · induction</text></g>
<g class="node algebra" id="node-eg" data-node="eg" tabindex="0" role="button" aria-label="All Evans–Gannon equations" aria-pressed="false"><title>All Evans–Gannon equations</title><desc>The quartic residual is a contraction of cubic and quadratic residuals. Combine its vanishing with the proved linear, quadratic, and cubic identities to obtain the complete EGEquations structure.</desc><rect class="card" x="520" y="914" width="360" height="76" rx="3" fill="#20372b" stroke="#78bd94" stroke-width="1.5"/><text x="536" y="932" font-size="10" fill="#bee3cc" font-weight="600" text-anchor="start" letter-spacing=".7">COMPLETION · EVANS–GANNON</text><text x="536" y="956" font-size="16" fill="#bee3cc" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">EGEquations_concrete</text><text x="536" y="977" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Linear, quadratic, cubic and quartic identities</text></g>
<g class="node result" id="node-odd" data-node="odd" tabindex="0" role="button" aria-label="Every odd n" aria-pressed="false"><title>Every odd n</title><desc>exists_EGEquations_odd requires only Odd n. The theorem covers every odd natural number, including n = 1, and supplies concrete complex coefficient data satisfying all Evans–Gannon equations. Categorical reconstruction is outside this formalization.</desc><rect class="card" x="986" y="914" width="360" height="76" rx="3" fill="#42182f" stroke="#ed67ae" stroke-width="2"/><text x="1002" y="932" font-size="10" fill="#f4bddc" font-weight="600" text-anchor="start" letter-spacing=".7">MAIN THEOREM · EVERY ODD n</text><text x="1002" y="956" font-size="16" fill="#f4bddc" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">exists_EGEquations_odd</text><text x="1002" y="977" font-size="12" fill="#b5bcc5" font-weight="400" text-anchor="start" >Explicit complex coefficient data · unconditional</text></g>

<aside aria-live="polite"><div><div id="status">Complete formalization</div><h2 id="detail-title">Every odd natural number</h2><p id="detail">The explicit hyperbolic gamma construction supplies the full analytic interface. The resulting complex coefficient data satisfy all Evans–Gannon equations.</p></div><div id="sources"></div></aside></main>
<script>
const nodes=[{"id": "integral", "kind": "gamma", "x": 54, "y": 164, "w": 360, "h": 82, "title": "Construct hyperbolic γ", "lines": ["Regularized BSS integral", "Finite-product continuation"], "detail": "Start with an explicit, absolutely convergent regularized integral on the fundamental strip. Prove holomorphy and extend the function by finite products of its shift factors.", "sources": [{"file": "Analytic/GammaIntegral.lean", "line": 340, "theorem": "GammaIntegral.integrableOn_integrand"}, {"file": "Analytic/GammaContinuation.lean", "line": 545, "theorem": "GammaContinuation.gamma"}]}, {"id": "core", "kind": "gamma", "x": 520, "y": 164, "w": 360, "h": 82, "title": "Gamma foundation", "lines": ["Shifts · reflection · poles & residues", "Uniform growth estimates"], "detail": "Prove the local identities, exact pole and zero sets, simple residues for irrational period ratios, positivity, and the uniform ratio estimates needed for contour decay. These results supply HypGammaCore.", "sources": [{"file": "Analytic/GammaCore.lean", "line": 27, "theorem": "GammaContinuation.core"}]}, {"id": "two_gamma", "kind": "gamma", "x": 986, "y": 164, "w": 360, "h": 82, "title": "Two-gamma transform", "lines": ["Dual shifts + sech normalization", "Full crossed-pole evaluation"], "detail": "Local incommensurable periods determine the symmetric Fourier transform. The elementary sech integral fixes its normalization, and a finite shift argument extends the evaluation to the full residue-corrected domain.", "sources": [{"file": "Analytic/GammaFourierEvaluation.lean", "line": 52, "theorem": "symmetricTransform_evaluation"}, {"file": "Analytic/GammaTwoGammaInterface.lean", "line": 62, "theorem": "two_gamma_explicit"}]}, {"id": "four_gamma", "kind": "gamma", "x": 520, "y": 282, "w": 360, "h": 82, "title": "Four-gamma contours", "lines": ["Residue corrections + symmetries", "Four-term identity"], "detail": "Define K₄ by an actual vertical integral with finite residue corrections. Prove line independence, evenness, the swap identity, and the four-term relation. Generalized residues retain coincident poles. The contour machinery from this stage also supports Euler; the four-term relation itself is not used to prove Euler.", "sources": [{"file": "Analytic/GammaK4Interface.lean", "line": 32, "theorem": "K4_line_explicit"}, {"file": "Analytic/GammaK4FourTermInterface.lean", "line": 17, "theorem": "K4_four_term"}]}, {"id": "euler", "kind": "gamma", "x": 986, "y": 282, "w": 360, "h": 82, "title": "Euler transformation", "lines": ["Fourier insertion + Fubini", "Continuation with moving pole clusters"], "detail": "Prove Euler on an initial open domain by absolutely integrable Fourier insertion and Fubini. Fixed contour loops around moving pole clusters establish holomorphy, and a connected complex scaling domain extends the identity throughout the required convergent, non-pinched parameter range.", "sources": [{"file": "Analytic/GammaK4EulerInterface.lean", "line": 17, "theorem": "GammaK4Contour.K4_euler"}]}, {"id": "interface", "kind": "bridge", "x": 520, "y": 396, "w": 360, "h": 70, "title": "Full gamma interface", "lines": ["Specialized periods and analytic identities", "ruijsenaarsHypGamma"], "detail": "Assemble every HypGamma field from the explicit gamma construction and its integral identities. Specialize to ω₁ = d + 1 and ω₂ = 1 + 1/d. This interface supplies the analytic input throughout the coefficient proof, including direct uses in the column, product, and restricted Fourier transforms.", "sources": [{"file": "Analytic/GammaConstruction.lean", "line": 23, "theorem": "GammaContinuation.hypGamma"}, {"file": "Analytic/GammaConstruction.lean", "line": 37, "theorem": "ruijsenaarsHypGamma"}]}, {"id": "samples", "kind": "analysis", "x": 520, "y": 540, "w": 360, "h": 76, "title": "Sample the coefficients", "lines": ["F(z) = 1 / γ(ω₂ + z)", "Explicit odd-order matrix"], "detail": "The specialized gamma gives the samples W and the concrete coefficient data, including W₀ = −1 and Wₐ W₋ₐ = δ for nonzero a. The full gamma interface supplies analytic identities throughout the Fourier stage.", "sources": [{"file": "Analytic/Sampling.lean", "line": 366, "theorem": "Concrete.toCoeffData"}]}, {"id": "quadratics", "kind": "analysis", "x": 54, "y": 650, "w": 360, "h": 76, "title": "Quadratic identities", "lines": ["Column Fourier transform", "Q = 0"], "detail": "The column interpolation formula and the two-gamma transform determine the discrete Fourier transform of the samples. The reciprocal Fourier relation then proves all quadratic identities.", "sources": [{"file": "Analytic/ColumnFourier.lean", "line": 42, "theorem": "column_fourier"}, {"file": "Analytic/ColumnFourier.lean", "line": 391, "theorem": "Q_eq_zero"}]}, {"id": "products", "kind": "analysis", "x": 986, "y": 540, "w": 360, "h": 76, "title": "Product transforms", "lines": ["Left product · right product", "Negative-column transform"], "detail": "Contour sampling gives the two product transforms and the negative-column transform, including crossed poles, double poles, and exceptional sample corrections.", "sources": [{"file": "Analytic/LeftProduct.lean", "line": 1206, "theorem": "left_product"}, {"file": "Analytic/RightProduct.lean", "line": 1753, "theorem": "right_product"}, {"file": "Analytic/NegColumn.lean", "line": 372, "theorem": "neg_column"}]}, {"id": "restricted", "kind": "analysis", "x": 986, "y": 650, "w": 360, "h": 76, "title": "Restricted Fourier vanishing", "lines": ["Euler + four-term cancellation", "RestrictedFourier"], "detail": "Combine the product transforms with the proved Euler and four-term identities. Their coefficients cancel to give the restricted Fourier vanishing statement used in the algebraic completion.", "sources": [{"file": "Analytic/Restricted.lean", "line": 865, "theorem": "bracket_zero"}, {"file": "Analytic/Cubics.lean", "line": 70, "theorem": "restricted_fourier"}]}, {"id": "cubics", "kind": "algebra", "x": 520, "y": 806, "w": 360, "h": 76, "title": "All cubic identities", "lines": ["Boundary cases · interpolation · induction", "Normal forms + matrix reflection"], "detail": "Quadratics and restricted Fourier vanishing feed the ordered induction. Boundary and collision identities handle degenerate cases; normal forms and reflection by matrix inversion extend the result to every cubic identity.", "sources": [{"file": "Completion.lean", "line": 321, "theorem": "CoeffData.C_all"}]}, {"id": "eg", "kind": "algebra", "x": 520, "y": 914, "w": 360, "h": 76, "title": "All Evans–Gannon equations", "lines": ["Quartics from quadratics + cubics", "Linear identities + final assembly"], "detail": "The quartic residual is a contraction of cubic and quadratic residuals. Combine its vanishing with the proved linear, quadratic, and cubic identities to obtain the complete EGEquations structure.", "sources": [{"file": "Quartic.lean", "line": 97, "theorem": "Kq_eq_zero"}, {"file": "Completion.lean", "line": 357, "theorem": "EGEquations_of"}, {"file": "Analytic/Cubics.lean", "line": 92, "theorem": "EGEquations_concrete"}]}, {"id": "odd", "kind": "result", "x": 986, "y": 914, "w": 360, "h": 76, "title": "Every odd n", "lines": ["Explicit complex coefficient data", "Unconditional existence theorem"], "detail": "exists_EGEquations_odd requires only Odd n. The theorem covers every odd natural number, including n = 1, and supplies concrete complex coefficient data satisfying all Evans–Gannon equations. Categorical reconstruction is outside this formalization.", "sources": [{"file": "Analytic/GammaConstruction.lean", "line": 52, "theorem": "EGEquations_ruijsenaars"}, {"file": "Analytic/GammaConstruction.lean", "line": 58, "theorem": "exists_EGEquations_odd"}]}],edges=[["integral", "core"], ["core", "two_gamma"], ["core", "four_gamma"], ["two_gamma", "euler"], ["four_gamma", "euler"], ["four_gamma", "interface"], ["euler", "interface"], ["interface", "samples"], ["samples", "quadratics"], ["samples", "products"], ["products", "restricted"], ["quadratics", "cubics"], ["restricted", "cubics"], ["cubics", "eg"], ["eg", "odd"]],byId=new Map(nodes.map(n=>[n.id,n]));
const canvas=document.querySelector('#canvas'),sourceList=document.querySelector('#sources');
function ancestors(id){const found=new Set([id]),todo=[id];while(todo.length){const v=todo.pop();for(const [a,b] of edges)if(b===v&&!found.has(a)){found.add(a);todo.push(a)}}return found}
function sources(n){sourceList.replaceChildren();for(const s of n.sources){const a=document.createElement('a');a.href='../HaagerupIzumi/'+s.file;a.target='_blank';a.rel='noopener';a.textContent=s.theorem;const small=document.createElement('small');small.textContent=s.file+' · line '+s.line;const item=document.createElement('div');item.append(a,small);sourceList.append(item)}}
function select(id){const n=byId.get(id),set=ancestors(id);canvas.classList.add('tracing');document.querySelectorAll('.node').forEach(el=>{const active=el.dataset.node===id;el.classList.toggle('in-trace',set.has(el.dataset.node));el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.edge').forEach(el=>el.classList.toggle('in-trace',set.has(el.dataset.from)&&set.has(el.dataset.to)));document.querySelector('#status').textContent='Selected stage · '+(set.size-1)+' prerequisite stages';document.querySelector('#detail-title').textContent=n.title;document.querySelector('#detail').textContent=n.detail;sources(n)}
function reset(){canvas.classList.remove('tracing');document.querySelectorAll('.node').forEach(el=>{el.classList.remove('selected','in-trace');el.setAttribute('aria-pressed','false')});document.querySelectorAll('.edge').forEach(el=>el.classList.remove('in-trace'));document.querySelector('#status').textContent='Complete formalization';document.querySelector('#detail-title').textContent='Every odd natural number';document.querySelector('#detail').textContent='The explicit hyperbolic gamma construction supplies the full analytic interface. The resulting complex coefficient data satisfy all Evans–Gannon equations.';sources(byId.get('odd'))}
document.querySelectorAll('.node').forEach(el=>{el.addEventListener('click',()=>select(el.dataset.node));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el.dataset.node)}})});document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#print').addEventListener('click',()=>window.print());document.addEventListener('keydown',e=>{if(e.key==='Escape')reset()});reset();
</script></html>
