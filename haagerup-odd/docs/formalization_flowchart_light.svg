<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1048" viewBox="0 0 1400 1048" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">The complete odd-order Evans–Gannon formalization</title>
<desc id="chart-desc">Thirteen grouped proof stages, from the explicit hyperbolic gamma integral through its identities, finite Fourier analysis, and algebraic completion to the unconditional theorem for every odd natural number. Cyan marks gamma results; amber marks finite Fourier analysis; green marks algebraic completion; magenta marks the final theorem. Arrows show selected mathematical dependencies. The gamma interface supplies analytic input throughout the Fourier stage.</desc>
<defs>
<marker id="arrow-gamma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#207b8b"/></marker>
<marker id="arrow-analysis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#996719"/></marker>
<marker id="arrow-algebra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#487e56"/></marker>
<marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b13b78"/></marker>
</defs><g font-family="Adwaita Sans, DejaVu Sans, sans-serif">
<rect width="1400" height="1048" fill="#ffffff"/>
<text x="54" y="48" font-size="29" fill="#263238" font-weight="600" text-anchor="start" font-family="DejaVu Serif, Georgia, serif">From the Gamma Integral to Evans–Gannon</text>
<text x="54" y="79" font-size="14" fill="#53616d" font-weight="400" text-anchor="start" >From the hyperbolic gamma construction to the Evans–Gannon equations for every odd n.</text>
<text x="1346" y="45" font-size="11" fill="#53616d" font-weight="600" text-anchor="end" letter-spacing="1">LEAN 4 + MATHLIB</text>
<rect x="28" y="113" width="1344" height="371" rx="4" fill="#f3f9fa" stroke="#ccdde1"/>
<text x="54" y="140" font-size="11" fill="#216473" font-weight="600" text-anchor="start" letter-spacing="1.3">01  GAMMA FOUNDATION</text>
<text x="1346" y="140" font-size="10" fill="#216473" font-weight="600" text-anchor="end" letter-spacing=".8">INTEGRAL · CONTINUATION · TRANSFORM IDENTITIES</text>
<rect x="28" y="505" width="1344" height="240" rx="4" fill="#fcf9f1" stroke="#e2ddcf"/>
<text x="54" y="532" font-size="11" fill="#806020" font-weight="600" text-anchor="start" letter-spacing="1.2">02  FINITE FOURIER ANALYSIS</text>
<rect x="28" y="766" width="1344" height="238" rx="4" fill="#f3f8f3" stroke="#cfddd1"/>
<text x="54" y="793" font-size="11" fill="#376746" font-weight="600" text-anchor="start" letter-spacing="1.2">03  ALGEBRAIC COMPLETION</text>
<text x="74" y="302" font-size="16" fill="#365761" font-weight="500" text-anchor="start" >Hyperbolic gamma and its identities</text>
<text x="74" y="328" font-size="12.5" fill="#506b73" font-weight="400" text-anchor="start" >An explicit integral and contour transformations.</text>
<text x="74" y="355" font-size="12" fill="#506b73" font-weight="400" text-anchor="start" >Each box groups related Lean results.</text>
<text x="54" y="579" font-size="15" fill="#6b5833" font-weight="500" text-anchor="start" >Gamma input throughout this stage</text>
<text x="54" y="601" font-size="12" fill="#5c6670" font-weight="400" text-anchor="start" >Sampling, contour bounds, and transform identities.</text>
<text x="700" y="674" font-size="10" fill="#53616d" font-weight="600" text-anchor="middle" letter-spacing="1">TWO INPUTS TO COMPLETION</text>
<text x="700" y="699" font-size="12.5" fill="#4d5b67" font-weight="400" text-anchor="middle" >Q = 0 + restricted Fourier vanishing</text>
<text x="54" y="919" font-size="10" fill="#376746" font-weight="600" text-anchor="start" letter-spacing=".8">KERNEL-CHECKED FOUNDATIONS</text>
<text x="54" y="942" font-size="11.5" fill="#53616d" font-weight="400" text-anchor="start" >propext · Classical.choice · Quot.sound</text>
<text x="54" y="963" font-size="12" fill="#53616d" font-weight="400" text-anchor="start" >No sorrys or added axioms</text>
<g class="edges" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<path class="edge" data-from="integral" data-to="core" d="M 414 205 H 511" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="core" data-to="two_gamma" d="M 880 205 H 977" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="core" data-to="four_gamma" d="M 700 246 V 273" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="two_gamma" data-to="euler" d="M 1166 246 V 273" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="four_gamma" data-to="euler" d="M 880 323 H 977" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="four_gamma" data-to="interface" d="M 700 364 V 387" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="euler" data-to="interface" d="M 1166 364 V 417 Q 1166 431 1152 431 H 889" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="interface" data-to="samples" d="M 700 466 V 531" stroke="#207b8b" marker-end="url(#arrow-gamma)"/>
<path class="edge" data-from="samples" data-to="quadratics" d="M 590 616 V 619 Q 590 634 575 634 H 249 Q 234 634 234 641" stroke="#996719" marker-end="url(#arrow-analysis)"/>
<path class="edge" data-from="samples" data-to="products" d="M 880 578 H 977" stroke="#996719" marker-end="url(#arrow-analysis)"/>
<path class="edge" data-from="products" data-to="restricted" d="M 1166 616 V 641" stroke="#996719" marker-end="url(#arrow-analysis)"/>
<path class="edge" data-from="quadratics" data-to="cubics" d="M 414 688 H 440 Q 454 688 454 702 V 830 Q 454 844 468 844 H 511" stroke="#996719" marker-end="url(#arrow-analysis)"/>
<path class="edge" data-from="restricted" data-to="cubics" d="M 1166 726 V 830 Q 1166 844 1152 844 H 889" stroke="#996719" marker-end="url(#arrow-analysis)"/>
<path class="edge" data-from="cubics" data-to="eg" d="M 700 882 V 905" stroke="#487e56" marker-end="url(#arrow-algebra)"/>
<path class="edge" data-from="eg" data-to="odd" d="M 880 952 H 977" stroke="#b13b78" marker-end="url(#arrow-result)"/>
</g>
<text x="932" y="311" font-size="10" fill="#5b6f76" font-weight="400" text-anchor="middle" >contour tools</text>
<g class="node gamma" id="node-integral" data-node="integral" tabindex="0" role="button" aria-label="Construct hyperbolic γ" aria-pressed="false"><title>Construct hyperbolic γ</title><desc>Start with an explicit, absolutely convergent regularized integral on the fundamental strip. Prove holomorphy and extend the function by finite products of its shift factors.</desc><rect class="card" x="54" y="164" width="360" height="82" rx="3" fill="#eaf6f8" stroke="#207b8b" stroke-width="1.5"/><text x="70" y="182" font-size="10" fill="#145461" font-weight="600" text-anchor="start" letter-spacing=".7">CONSTRUCTION · REGULARIZED INTEGRAL</text><text x="70" y="206" font-size="16" fill="#145461" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">GammaContinuation.gamma</text><text x="70" y="227" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >BSS integral · finite-product continuation</text></g>
<g class="node gamma" id="node-core" data-node="core" tabindex="0" role="button" aria-label="Gamma foundation" aria-pressed="false"><title>Gamma foundation</title><desc>Prove the local identities, exact pole and zero sets, simple residues for irrational period ratios, positivity, and the uniform ratio estimates needed for contour decay. These results supply HypGammaCore.</desc><rect class="card" x="520" y="164" width="360" height="82" rx="3" fill="#eaf6f8" stroke="#207b8b" stroke-width="1.5"/><text x="536" y="182" font-size="10" fill="#145461" font-weight="600" text-anchor="start" letter-spacing=".7">CORE · SHIFTS, POLES &amp; GROWTH</text><text x="536" y="206" font-size="16" fill="#145461" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">GammaContinuation.core</text><text x="536" y="227" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Reflection · residues · uniform ratio bounds</text></g>
<g class="node gamma" id="node-two_gamma" data-node="two_gamma" tabindex="0" role="button" aria-label="Two-gamma transform" aria-pressed="false"><title>Two-gamma transform</title><desc>Local incommensurable periods determine the symmetric Fourier transform. The elementary sech integral fixes its normalization, and a finite shift argument extends the evaluation to the full residue-corrected domain.</desc><rect class="card" x="986" y="164" width="360" height="82" rx="3" fill="#eaf6f8" stroke="#207b8b" stroke-width="1.5"/><text x="1002" y="182" font-size="10" fill="#145461" font-weight="600" text-anchor="start" letter-spacing=".7">TWO-GAMMA · FOURIER EVALUATION</text><text x="1002" y="206" font-size="16" fill="#145461" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">two_gamma_explicit</text><text x="1002" y="227" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Dual shifts · sech normalization · crossed poles</text></g>
<g class="node gamma" id="node-four_gamma" data-node="four_gamma" tabindex="0" role="button" aria-label="Four-gamma contours" aria-pressed="false"><title>Four-gamma contours</title><desc>Define K₄ by an actual vertical integral with finite residue corrections. Prove line independence, evenness, the swap identity, and the four-term relation. Generalized residues retain coincident poles. The contour machinery from this stage also supports Euler; the four-term relation itself is not used to prove Euler.</desc><rect class="card" x="520" y="282" width="360" height="82" rx="3" fill="#eaf6f8" stroke="#207b8b" stroke-width="1.5"/><text x="536" y="300" font-size="10" fill="#145461" font-weight="600" text-anchor="start" letter-spacing=".7">FOUR-GAMMA · CORRECTED CONTOURS</text><text x="536" y="324" font-size="16" fill="#145461" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">K4_line_explicit · K4_four_term</text><text x="536" y="345" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Residues · line independence · evenness · swap</text></g>
<g class="node gamma" id="node-euler" data-node="euler" tabindex="0" role="button" aria-label="Euler transformation" aria-pressed="false"><title>Euler transformation</title><desc>Prove Euler on an initial open domain by absolutely integrable Fourier insertion and Fubini. Fixed contour loops around moving pole clusters establish holomorphy, and a connected complex scaling domain extends the identity throughout the required convergent, non-pinched parameter range.</desc><rect class="card" x="986" y="282" width="360" height="82" rx="3" fill="#eaf6f8" stroke="#207b8b" stroke-width="1.5"/><text x="1002" y="300" font-size="10" fill="#145461" font-weight="600" text-anchor="start" letter-spacing=".7">EULER · PARAMETER CONTINUATION</text><text x="1002" y="324" font-size="16" fill="#145461" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">K4_euler</text><text x="1002" y="345" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Fourier insertion · Fubini · moving pole clusters</text></g>
<g class="node bridge" id="node-interface" data-node="interface" tabindex="0" role="button" aria-label="Full gamma interface" aria-pressed="false"><title>Full gamma interface</title><desc>Assemble every HypGamma field from the explicit gamma construction and its integral identities. Specialize to ω₁ = d + 1 and ω₂ = 1 + 1/d. This interface supplies the analytic input throughout the coefficient proof, including direct uses in the column, product, and restricted Fourier transforms.</desc><rect class="card" x="520" y="396" width="360" height="70" rx="3" fill="#d9f0f4" stroke="#176b80" stroke-width="2"/><text x="536" y="414" font-size="10" fill="#104c5c" font-weight="600" text-anchor="start" letter-spacing=".7">FULL INTERFACE · SPECIALIZED PERIODS</text><text x="536" y="438" font-size="16" fill="#104c5c" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">ruijsenaarsHypGamma</text><text x="536" y="459" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Analytic input for the coefficient construction</text></g>
<g class="node analysis" id="node-samples" data-node="samples" tabindex="0" role="button" aria-label="Sample the coefficients" aria-pressed="false"><title>Sample the coefficients</title><desc>The specialized gamma gives the samples W and the concrete coefficient data, including W₀ = −1 and Wₐ W₋ₐ = δ for nonzero a. The full gamma interface supplies analytic identities throughout the Fourier stage.</desc><rect class="card" x="520" y="540" width="360" height="76" rx="3" fill="#fff4dc" stroke="#996719" stroke-width="1.5"/><text x="536" y="558" font-size="10" fill="#744d11" font-weight="600" text-anchor="start" letter-spacing=".7">SAMPLING · CONCRETE COEFFICIENTS</text><text x="536" y="582" font-size="16" fill="#744d11" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">Concrete.toCoeffData</text><text x="536" y="603" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >F(z) = 1/γ(ω₂ + z) · explicit odd-order matrix</text></g>
<g class="node analysis" id="node-quadratics" data-node="quadratics" tabindex="0" role="button" aria-label="Quadratic identities" aria-pressed="false"><title>Quadratic identities</title><desc>The column interpolation formula and the two-gamma transform determine the discrete Fourier transform of the samples. The reciprocal Fourier relation then proves all quadratic identities.</desc><rect class="card" x="54" y="650" width="360" height="76" rx="3" fill="#fff4dc" stroke="#996719" stroke-width="1.5"/><text x="70" y="668" font-size="10" fill="#744d11" font-weight="600" text-anchor="start" letter-spacing=".7">COLUMN FOURIER · QUADRATICS</text><text x="70" y="692" font-size="16" fill="#744d11" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">column_fourier · Q_eq_zero</text><text x="70" y="713" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >All quadratic residuals vanish</text></g>
<g class="node analysis" id="node-products" data-node="products" tabindex="0" role="button" aria-label="Product transforms" aria-pressed="false"><title>Product transforms</title><desc>Contour sampling gives the two product transforms and the negative-column transform, including crossed poles, double poles, and exceptional sample corrections.</desc><rect class="card" x="986" y="540" width="360" height="76" rx="3" fill="#fff4dc" stroke="#996719" stroke-width="1.5"/><text x="1002" y="558" font-size="10" fill="#744d11" font-weight="600" text-anchor="start" letter-spacing=".7">PRODUCTS · CONTOUR SAMPLING</text><text x="1002" y="582" font-size="16" fill="#744d11" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">left_product · right_product</text><text x="1002" y="603" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Product transforms + negative-column transform</text></g>
<g class="node analysis" id="node-restricted" data-node="restricted" tabindex="0" role="button" aria-label="Restricted Fourier vanishing" aria-pressed="false"><title>Restricted Fourier vanishing</title><desc>Combine the product transforms with the proved Euler and four-term identities. Their coefficients cancel to give the restricted Fourier vanishing statement used in the algebraic completion.</desc><rect class="card" x="986" y="650" width="360" height="76" rx="3" fill="#fff4dc" stroke="#996719" stroke-width="1.5"/><text x="1002" y="668" font-size="10" fill="#744d11" font-weight="600" text-anchor="start" letter-spacing=".7">RESTRICTED · FOURIER VANISHING</text><text x="1002" y="692" font-size="16" fill="#744d11" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">restricted_fourier</text><text x="1002" y="713" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Euler + four-term identity cancel the bracket</text></g>
<g class="node algebra" id="node-cubics" data-node="cubics" tabindex="0" role="button" aria-label="All cubic identities" aria-pressed="false"><title>All cubic identities</title><desc>Quadratics and restricted Fourier vanishing feed the ordered induction. Boundary and collision identities handle degenerate cases; normal forms and reflection by matrix inversion extend the result to every cubic identity.</desc><rect class="card" x="520" y="806" width="360" height="76" rx="3" fill="#eaf4eb" stroke="#487e56" stroke-width="1.5"/><text x="536" y="824" font-size="10" fill="#295d37" font-weight="600" text-anchor="start" letter-spacing=".7">COMPLETION · ALL CUBICS</text><text x="536" y="848" font-size="16" fill="#295d37" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">CoeffData.C_all</text><text x="536" y="869" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Boundary cases · interpolation · induction</text></g>
<g class="node algebra" id="node-eg" data-node="eg" tabindex="0" role="button" aria-label="All Evans–Gannon equations" aria-pressed="false"><title>All Evans–Gannon equations</title><desc>The quartic residual is a contraction of cubic and quadratic residuals. Combine its vanishing with the proved linear, quadratic, and cubic identities to obtain the complete EGEquations structure.</desc><rect class="card" x="520" y="914" width="360" height="76" rx="3" fill="#eaf4eb" stroke="#487e56" stroke-width="1.5"/><text x="536" y="932" font-size="10" fill="#295d37" font-weight="600" text-anchor="start" letter-spacing=".7">COMPLETION · EVANS–GANNON</text><text x="536" y="956" font-size="16" fill="#295d37" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">EGEquations_concrete</text><text x="536" y="977" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Linear, quadratic, cubic and quartic identities</text></g>
<g class="node result" id="node-odd" data-node="odd" tabindex="0" role="button" aria-label="Every odd n" aria-pressed="false"><title>Every odd n</title><desc>exists_EGEquations_odd requires only Odd n. The theorem covers every odd natural number, including n = 1, and supplies concrete complex coefficient data satisfying all Evans–Gannon equations. Categorical reconstruction is outside this formalization.</desc><rect class="card" x="986" y="914" width="360" height="76" rx="3" fill="#fce9f3" stroke="#b13b78" stroke-width="2"/><text x="1002" y="932" font-size="10" fill="#882857" font-weight="600" text-anchor="start" letter-spacing=".7">MAIN THEOREM · EVERY ODD n</text><text x="1002" y="956" font-size="16" fill="#882857" font-weight="500" text-anchor="start" font-family="Adwaita Mono, DejaVu Sans Mono, monospace">exists_EGEquations_odd</text><text x="1002" y="977" font-size="12" fill="#4d5b67" font-weight="400" text-anchor="start" >Explicit complex coefficient data · unconditional</text></g>
<text x="54" y="1030" font-size="10.5" fill="#63707b" font-weight="400" text-anchor="start" >Grouped proof stages; selected dependency arrows.</text>
<text x="1346" y="1030" font-size="10.5" fill="#63707b" font-weight="400" text-anchor="end" >EG equations proved. Categorical reconstruction is outside this formalization.</text>
</g></svg>